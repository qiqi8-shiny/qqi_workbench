name: 科研通每日签到

on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC 时间
    # 北京时间 08:00 = UTC 00:00
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发测试

permissions:
  contents: write        # 允许把 signin-status.json 提交回仓库，供前端读取

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: 科研通签到
        env:
          KYT_USER: ${{ secrets.KYT_USER }}
          KYT_PASS: ${{ secrets.KYT_PASS }}
        run: python main.py

      - name: 提交签到状态到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signin-status.json
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: 更新科研通签到状态 $(date +%F)"
            git push
          fi
